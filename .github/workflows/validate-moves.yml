name: Validate moves.json

on:
  push:
    paths:
      - "moves.json"
      - "scripts/validate_moves.py"
      - "assets/**"
  pull_request:
    paths:
      - "moves.json"
      - "scripts/validate_moves.py"
      - "assets/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate moves.json
        run: python3 scripts/validate_moves.py
